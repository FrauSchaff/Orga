<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochentabelle</title>
<style>
:root{
  --bg:#f4f6f9;--surface:#ffffff;--bar:#dce6f1;--head:#f2f2f2;--rowb:#dae9f7;--line:#444444;--text:#111820;--muted:#556070;--accent:#1f5fa8;--accent-text:#ffffff;--code:#3a6ea5;--ink:#111820;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14181e;--surface:#1b2129;--bar:#26354a;--head:#252d38;--rowb:#22303f;--line:#7b8798;--text:#e8edf3;--muted:#98a3b3;--accent:#6fa8e8;--accent-text:#0c1520;--code:#7fb0e6;--ink:#f2f5f9;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14181e;--surface:#1b2129;--bar:#26354a;--head:#252d38;--rowb:#22303f;--line:#7b8798;--text:#e8edf3;--muted:#98a3b3;--accent:#6fa8e8;--accent-text:#0c1520;--code:#7fb0e6;--ink:#f2f5f9;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:16px}
.wrap{max-width:1000px;margin:0 auto;padding:0 8px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border:1px solid var(--line);border-top:0;padding:10px 14px 12px;text-align:center}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:6}
.top input.t{display:block;width:100%;background:transparent;border:0;border-radius:0;color:var(--text);font-family:inherit;text-align:center;padding:2px 4px}
.top input.t:focus{outline:none;background:rgba(255,255,255,.35)}
#t1{font-size:1.5rem;font-weight:700;text-decoration:underline;margin-bottom:6px}
#t2{font-size:1.2rem;font-weight:700}
#t3{font-size:.82rem;font-weight:700}
.lbl{font-size:.85rem;color:var(--text)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:18px;max-width:380px;width:100%}
.dlg p{margin:0 0 16px;line-height:1.4}
.dlg div{display:flex;gap:8px;justify-content:flex-end}
.tools{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tools button{font:inherit;font-size:.9rem;cursor:pointer;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:6px 10px;min-height:38px}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.tools button:disabled{opacity:.45;cursor:not-allowed}
.sw{width:38px;padding:0!important}
.sw i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto;border:2px solid var(--line)}
.sw[aria-pressed="true"] i{border-color:var(--accent-text)}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.searchrow{margin-top:8px;display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.searchrow input:focus-visible,button:focus-visible,.top input.t:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.status{margin:8px 0 0;font-size:.85rem;color:var(--muted);min-height:1.2em}
.status.err{color:#c0392b;font-weight:700}
.empty button{margin-top:14px}
.empty{margin:48px auto;text-align:center;color:var(--muted);max-width:420px;line-height:1.5}
.create{margin:20px 0;padding:14px;background:var(--surface);border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--surface)}
thead th{position:sticky;top:var(--barh,260px);z-index:4;background:var(--head);border:1px solid var(--line);padding:8px 2px;font-size:.9rem;line-height:1.4}
thead th small{display:block;font-weight:400;font-size:.92em}
th.cname{width:15%}th.cnr{width:30px}
td{border:1px solid var(--line);padding:0;height:62px;vertical-align:top}
td.nr{text-align:center;vertical-align:middle;color:var(--muted);font-size:.85rem;background:var(--head)}
td.name{background:var(--surface)!important;padding:8px 4px;font-weight:700;text-align:center;vertical-align:middle;word-break:break-word;line-height:1.35}
td.name .del{display:block;margin:12px auto 0;font-size:.72rem;font-weight:400;padding:3px 8px;color:var(--muted)}
tr.b td:not(.name):not(.nr){background:var(--rowb)}
tbody.person.gap tr:first-child td{border-top-width:3px}
.cell{position:relative;height:62px}
.txt{position:absolute;inset:0;padding:5px 7px;display:flex;flex-direction:column;justify-content:space-around;pointer-events:none}
.txt div{display:flex;justify-content:space-between;gap:4px}
.txt b{font-size:.95rem}
.txt span{color:var(--code);font-size:.9rem}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.kb{position:absolute;left:4px;right:4px;bottom:2px;height:22px;z-index:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;font-weight:700;text-align:center;padding:0;min-width:0}
.kb:focus{outline:2px solid var(--accent);outline-offset:0;border-radius:4px}
body.ro .cell canvas{cursor:default}
.foot{margin:28px 0 0;text-align:center}
.foot button{font-size:.85rem;color:var(--muted)}
@media (max-width:600px){
  #t1{font-size:1.2rem}#t2{font-size:1rem}#t3{font-size:.7rem}.lbl{font-size:.75rem}
  thead th{font-size:.62rem;padding:6px 0}
  th.cname{width:15%}th.cnr{width:20px}
  .txt{padding:3px 3px}.txt b{font-size:.72rem}.txt span{font-size:.66rem}
  td,.cell{height:58px}
  .tools button{padding:5px 7px;font-size:.8rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <input class="t" id="t1" type="text" aria-label="Woche" autocomplete="off">
    <input class="t" id="t2" type="text" aria-label="Überschrift" autocomplete="off">
    <input class="t" id="t3" type="text" aria-label="Hinweis" autocomplete="off">
    <div class="tools" role="toolbar" aria-label="Zeichenwerkzeuge">
      <span class="lbl">Farbe der Eintragung:</span>
      <button type="button" class="sw" id="c0" aria-pressed="true" aria-label="Farbe Grün"><i style="background:#1f8f4e"></i></button>
      <button type="button" class="sw" id="c1" aria-pressed="false" aria-label="Farbe Orange"><i style="background:#e07b00"></i></button>
      <button type="button" class="sw" id="c2" aria-pressed="false" aria-label="Farbe Rot"><i style="background:#d12c2c"></i></button>
    </div>
    <div class="searchrow"><input id="q" type="search" placeholder="Namen suchen …" autocomplete="off" aria-label="Namen suchen"><button class="primary" id="showall" type="button">Alle Einträge anzeigen</button></div>
    <p class="status" id="status" role="status">Verbinde …</p>
  </div>
  <div id="out"></div>
  <div class="foot"><button id="clear" type="button">Alle Einträge leeren</button></div>
</div>
<script>
(function(){
  var DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
  var PLAN=[
    [[["B","SO"]],[["Sw","KT"],["Sm","LU"]],[["Ph","GR"]],[["E","EK"]],[["M","SB"]]],
    [[["M","SB"]],[["Sw","KT"],["Sm","LU"]],[["BwR","MG"]],[["B","SO"]],[["Geo","BR"]]],
    [[["D","GL"]],[["K","LH"],["Ev","SK"]],[["E","EK"]],[["K","LH"],["Ev","SK"]],[["BwR","MG"]]],
    [[["D","GL"]],[["D","GL"]],[["E","EK"]],[["D","GL"]],[["WR","BUS"],["WR","MG"]]],
    [[["G","KH"]],[["M","SB"]],[["Geo","BR"]],[["WR","MG"],["WR","BUS"]],[["E","EK"]]],
    [[["IT","BZ"],["IT","SB"]],[["Ph","GR"]],[["Mu","KB"]],[["BwR","MG"]],[["G","KH"]]]
  ];
  var NAMES=["Mustafa Ali", "Ilyas Latinas", "Sara Astuto", "Oliver Bätz", "Mara Callian", "Jan Chtchetinine", "Hannes Diesmal", "Kiara Ewald", "Selina Feineis", "Leon Folchert", "Antonia Gladbach", "Luisa Gustin", "Robert Gwosdz", "Levin Haberkorn", "Finn Hauck", "Emilia Hemrich", "Jakob Hollenbach", "Henry Hundt", "Kathlen Kämpf", "Paul Körner", "Daniel Latoska", "Hannes Mack", "Mats Pöhlmann", "Anna Rügamer", "Nicolas Schäfer", "Henry Schmitt", "Fabio Schubert", "Aaron Wenzel", "Joel Wunderling"];
  var DEF={t1:"Woche 26.10. bis 30.10.",t2:"Diese Schüler:Innen haben heute im Unterricht gestört …",t3:"Bitte Haken und das Kürzel dahinter machen 👍"};
  var KEY="wochentabelle-v4",PEN=2.4,ERASER=20;
  var state={header:Object.assign({},DEF),people:{}};
  var marks={},texts={},tcol={};   // marks[pid][k] = Striche, texts[pid][k] = getippter Text
  var mode="pending",readOnly=false,db=null,showAll=false,lastKey="";
  var dirty={},timers={},inflight={},busy=0,hdrTimer=null,note="";
  var tool="p",color=0,cur=null,cvm={},ivm={};
  var $=function(id){return document.getElementById(id)};
  var q=$("q"),out=$("out"),top=$("top"),statusEl=$("status"),T=["t1","t2","t3"].map($);

  function setStatus(t,err){statusEl.textContent=t;statusEl.className="status"+(err?" err":"");}
  function pad(x){return (x<10?"0":"")+x}
  function clock(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
  function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
  function ids(){return Object.keys(state.people).sort(function(a,b){var d=state.people[a].order-state.people[b].order;return d||a.localeCompare(b)});}
  function getM(pid,k){return (marks[pid]&&marks[pid][k])||[];}
  function setM(pid,k,arr){(marks[pid]=marks[pid]||{})[k]=arr;}
  function askConfirm(msg,yes){
    var o=document.createElement("div");o.className="ovl";
    o.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><p></p><div><button type="button" class="no">Abbrechen</button><button type="button" class="primary yes">Ja, löschen</button></div></div>';
    o.querySelector("p").textContent=msg;
    document.body.appendChild(o);
    function close(){o.remove();}
    o.querySelector(".no").addEventListener("click",close);
    o.querySelector(".yes").addEventListener("click",function(){close();yes();});
    o.addEventListener("click",function(e){if(e.target===o)close();});
    o.querySelector(".no").focus();
  }
  function getTC(pid,k){return (tcol[pid]&&tcol[pid][k])||0;}
  function setTC(pid,k,v){(tcol[pid]=tcol[pid]||{})[k]=v;}
  function getT(pid,k){return (texts[pid]&&texts[pid][k])||"";}
  function setT(pid,k,v){(texts[pid]=texts[pid]||{})[k]=v;}
  function hasEntries(pid){var m=marks[pid]||{},t=texts[pid]||{};return Object.keys(m).some(function(k){return m[k]&&m[k].length>0})||Object.keys(t).some(function(k){return !!t[k]});}
  function keysOf(pid){var o={};Object.keys(marks[pid]||{}).forEach(function(k){o[k]=1});Object.keys(texts[pid]||{}).forEach(function(k){o[k]=1});return Object.keys(o);}
  function uniq(v,i,a){return a.indexOf(v)===i;}
  function stacked(nm){var i=nm.indexOf(" ");return i<0?esc(nm):esc(nm.slice(0,i))+"<br>"+esc(nm.slice(i+1));}
  function setBar(){document.documentElement.style.setProperty("--barh",(top.offsetHeight-1)+"px");}
  window.addEventListener("resize",setBar);
  function idle(){return busy===0&&!Object.keys(timers).length&&!hdrTimer;}
  function savedStatus(){if(idle())setStatus(note+"Alle Änderungen gespeichert ("+clock()+" Uhr).");else setStatus(note+"Speichert …");}

  /* ---------- lokaler Modus ---------- */
  function seedLocal(){NAMES.forEach(function(n,i){state.people["p"+pad(i+1)]={name:n,order:i+1}});}
  function loadLocal(){
    var ok=false;
    try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&s.people){state.people=s.people;if(s.header)state.header=Object.assign({},DEF,s.header);if(s.marks)marks=s.marks;if(s.texts)texts=s.texts;if(s.tcol)tcol=s.tcol;ok=true;}}}catch(e){}
    if(!ok)seedLocal();
  }
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({header:state.header,people:state.people,marks:marks,texts:texts,tcol:tcol}));}catch(e){}}

  /* ---------- Speichern (gemeinsame Datenbank) ---------- */
  function docId(pid,k){return pid+"_"+k;}
  function save(pid,k){
    if(mode==="local"){saveLocal();return;}
    var id=docId(pid,k);dirty[id]=[pid,k];
    clearTimeout(timers[id]);setStatus(note+"Speichert …");
    timers[id]=setTimeout(function(){delete timers[id];flush(id);},400);
  }
  function flush(id){
    if(timers[id]){clearTimeout(timers[id]);delete timers[id];}
    var d=dirty[id];if(!d)return Promise.resolve();
    busy++;
    var p=(inflight[id]||Promise.resolve()).then(function(){
      var dd=dirty[id]||d;delete dirty[id];
      var arr=getM(dd[0],dd[1]),tx=getT(dd[0],dd[1]),ref=db.doc("marks/"+id);
      return (arr.length||tx)?ref.set({p:dd[0],s:JSON.stringify(arr),t:tx,tc:getTC(dd[0],dd[1])}):ref.delete();
    }).then(function(){busy--;savedStatus();},function(er){
      busy--;dirty[id]=d;
      setStatus("Speichern fehlgeschlagen ("+((er&&er.code)||"Fehler")+"). Bitte noch einmal versuchen.",true);
    });
    inflight[id]=p;return p;
  }
  function flushAll(){
    var all=Object.keys(timers).concat(Object.keys(dirty)).filter(function(v,i,a){return a.indexOf(v)===i});
    return Promise.all(all.map(flush));
  }
  function writeHeader(){
    if(mode==="local"){saveLocal();return;}
    clearTimeout(hdrTimer);setStatus(note+"Speichert …");
    hdrTimer=setTimeout(function(){
      hdrTimer=null;busy++;
      db.doc("meta/header").set({t1:state.header.t1,t2:state.header.t2,t3:state.header.t3}).then(function(){busy--;savedStatus();},function(e){busy--;setStatus("Speichern fehlgeschlagen ("+((e&&e.code)||"Fehler")+").",true);});
    },600);
  }
  T.forEach(function(el,i){var k=["t1","t2","t3"][i];el.addEventListener("input",function(){state.header[k]=el.value;writeHeader();setBar();});});
  function showHeader(){T.forEach(function(el,i){var k=["t1","t2","t3"][i];if(document.activeElement!==el)el.value=state.header[k];el.readOnly=readOnly;});setBar();}

  /* ---------- Zeichnen ---------- */
  function inkTheme(c){return c===1?"#e07b00":c===2?"#d12c2c":"#1f8f4e";}
  function inkPrint(c){return inkTheme(c);}
  function styleFor(ctx,s,inkFn){
    ctx.globalCompositeOperation=s.e?"destination-out":"source-over";
    ctx.strokeStyle=inkFn(s.c);ctx.lineWidth=s.w;ctx.lineCap="round";ctx.lineJoin="round";
  }
  function drawStrokes(ctx,arr,W,H,inkFn){
    arr.forEach(function(s){
      var p=s.p;if(!p||!p.length)return;
      styleFor(ctx,s,inkFn);ctx.beginPath();ctx.moveTo(p[0]*W,p[1]*H);
      for(var i=2;i<p.length;i+=2)ctx.lineTo(p[i]*W,p[i+1]*H);
      if(p.length===2)ctx.lineTo(p[0]*W+.01,p[1]*H);
      ctx.stroke();
    });
  }
  function redrawCanvas(c){
    var pid=c.dataset.p,k=c.dataset.k,dpr=window.devicePixelRatio||1,r=c.parentNode.getBoundingClientRect();
    var w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
    if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
    var x=c.getContext("2d");
    x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.setTransform(dpr,0,0,dpr,0,0);
    drawStrokes(x,getM(pid,k),r.width,r.height,inkTheme);
  }
  function redrawKey(pid,k){var c=cvm[docId(pid,k)];if(c&&c.isConnected)redrawCanvas(c);}
  function syncInput(pid,k){var i=ivm[docId(pid,k)];if(i&&i.isConnected){i.style.color=inkTheme(getTC(pid,k));if(document.activeElement!==i)i.value=getT(pid,k);}}
  var ro=window.ResizeObserver?new ResizeObserver(function(list){list.forEach(function(en){var c=en.target.querySelector("canvas");if(c&&!(cur&&cur.c===c))redrawCanvas(c);});}):null;

  function addPt(e){
    var c=cur.c,r=c.getBoundingClientRect(),p=cur.s.p,n=p.length;
    var px=Math.min(r.width,Math.max(0,e.clientX-r.left)),py=Math.min(r.height,Math.max(0,e.clientY-r.top));
    if(n>=2&&Math.abs(p[n-2]*r.width-px)+Math.abs(p[n-1]*r.height-py)<1)return;
    var dpr=window.devicePixelRatio||1,ctx=c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);styleFor(ctx,cur.s,inkTheme);ctx.beginPath();
    if(n>=2){ctx.moveTo(p[n-2]*r.width,p[n-1]*r.height);ctx.lineTo(px,py);}
    else{ctx.moveTo(px,py);ctx.lineTo(px+.01,py);}
    ctx.stroke();
    p.push(Math.round(px/r.width*10000)/10000,Math.round(py/r.height*10000)/10000);
  }
  out.addEventListener("input",function(e){
    var t=e.target;if(!t.classList||!t.classList.contains("kb")||readOnly)return;
    setT(t.dataset.p,t.dataset.k,t.value);setTC(t.dataset.p,t.dataset.k,color);t.style.color=inkTheme(color);save(t.dataset.p,t.dataset.k);
  });
  out.addEventListener("pointerdown",function(e){
    var c=e.target;if(!c||c.tagName!=="CANVAS"||readOnly||cur)return;
    if(e.pointerType==="mouse"&&e.button!==0)return;
    e.preventDefault();
    try{c.setPointerCapture(e.pointerId);}catch(_){}
    cur={c:c,pid:c.dataset.p,k:c.dataset.k,id:e.pointerId,s:{e:tool==="e"?1:0,c:color,w:tool==="e"?ERASER:PEN,p:[]}};
    addPt(e);
  });
  out.addEventListener("pointermove",function(e){
    if(!cur||e.pointerId!==cur.id)return;
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!evs.length)evs=[e];
    evs.forEach(addPt);
  });
  function endStroke(e){
    if(!cur||e.pointerId!==cur.id)return;
    var s=cur.s,pid=cur.pid,k=cur.k,c=cur.c;cur=null;
    var r=c.getBoundingClientRect(),mnx=1,mxx=0,mny=1,mxy=0;
    for(var i=0;i<s.p.length;i+=2){mnx=Math.min(mnx,s.p[i]);mxx=Math.max(mxx,s.p[i]);mny=Math.min(mny,s.p[i+1]);mxy=Math.max(mxy,s.p[i+1]);}
    if(s.p.length>=2&&(mxx-mnx)*r.width<5&&(mxy-mny)*r.height<5){
      redrawCanvas(c);
      var inp=c.parentNode.querySelector(".kb");if(inp)inp.focus();
      return;
    }
    if(s.p.length>=2){var arr=getM(pid,k).slice();arr.push(s);setM(pid,k,arr);save(pid,k);}
  }
  out.addEventListener("pointerup",endStroke);
  out.addEventListener("pointercancel",endStroke);
  out.addEventListener("contextmenu",function(e){if(e.target.tagName==="CANVAS")e.preventDefault();});

  /* ---------- Werkzeuge ---------- */
  function setColor(c){color=c;[0,1,2].forEach(function(i){$("c"+i).setAttribute("aria-pressed",i===c);});}
  [0,1,2].forEach(function(i){$("c"+i).addEventListener("click",function(){setColor(i);});});
  function applyRO(){
    document.body.classList.toggle("ro",readOnly);
    ["c0","c1","c2"].forEach(function(id){$(id).disabled=readOnly;});
  }

  /* ---------- Anzeige ---------- */
  function viewIds(){
    var term=q.value.trim();
    if(showAll)return ids().filter(hasEntries);
    if(!term)return [];
    var low=norm(term);
    return ids().filter(function(id){return norm(state.people[id].name).indexOf(low)!==-1});
  }
  function refresh(){
    if(cur)return;
    var list=viewIds();
    var key=mode+"|"+showAll+"|"+q.value.trim()+"|"+readOnly+"|"+ids().length+"|"+list.map(function(id){return id+":"+state.people[id].name}).join(",");
    if(key===lastKey&&out.querySelector("tbody"))return;
    lastKey=key;render(list);
  }
  function render(list){
    var term=q.value.trim(),low=norm(term),html="";
    if(ro)ro.disconnect();cvm={};ivm={};
    if(mode==="pending"){out.innerHTML='<div class="empty">Verbinde …</div>';setBar();return;}
    if(!ids().length){
      html='<div class="empty">Es sind noch keine Namen vorhanden.'+(readOnly?'':'<br><button class="primary" id="seed" type="button">Namen aus der Vorlage anlegen</button>')+'</div>';
      out.innerHTML=html;setBar();return;
    }
    if(showAll&&!list.length){out.innerHTML='<div class="empty">Es gibt noch keine Einträge.</div>';setBar();return;}
    if(!showAll&&!term){out.innerHTML='<div class="empty">Gib oben einen Namen ein. Die passende Tabelle erscheint, sobald du suchst.</div>';setBar();return;}
    if(!showAll&&!readOnly){
      var exact=ids().some(function(id){return norm(state.people[id].name)===low});
      if(!exact)html+='<div class="create"><span>'+(list.length?'Nicht der richtige Name dabei?':'Kein Name „'+esc(term)+'“ gefunden.')+'</span><button class="primary" id="add" type="button">„'+esc(term)+'“ neu anlegen</button></div>';
    }else if(!showAll&&!list.length){html+='<div class="empty">Kein Name „'+esc(term)+'“ gefunden.</div>';}
    if(list.length){
      html+='<table><thead><tr><th class="cname">Name</th><th class="cnr">Nr.</th>'+DAYS.map(function(d){return "<th>"+d+"</th>"}).join("")+'</tr></thead>';
      list.forEach(function(id,i){
        var p=state.people[id];
        html+='<tbody class="person'+(i?' gap':'')+'" data-id="'+esc(id)+'">';
        for(var r=0;r<6;r++){
          html+='<tr'+(r%2===1?' class="b"':'')+'>';
          if(r===0)html+='<td class="name" rowspan="6">'+stacked(p.name)+(readOnly?'':'<button class="del" type="button" data-del="'+esc(id)+'">Name löschen</button>')+'</td>';
          html+='<td class="nr">'+(r+1)+'</td>';
          for(var d=0;d<5;d++){
            var k=r+"-"+d;
            html+='<td><div class="cell"><div class="txt">'+PLAN[r][d].map(function(e){return "<div><b>"+esc(e[0])+"</b><span>"+esc(e[1])+"</span></div>"}).join("")+'</div><input class="kb" type="text" data-p="'+esc(id)+'" data-k="'+k+'" value="'+esc(getT(id,k))+'" style="color:'+inkTheme(getTC(id,k))+'" aria-label="Text '+esc(p.name)+', '+DAYS[d]+', Stunde '+(r+1)+'"'+(readOnly?' readonly':'')+'><canvas data-p="'+esc(id)+'" data-k="'+k+'" aria-label="'+esc(p.name)+', '+DAYS[d]+', Stunde '+(r+1)+'"></canvas></div></td>';
          }
          html+="</tr>";
        }
        html+="</tbody>";
      });
      html+="</table>";
    }
    out.innerHTML=html;setBar();
    Array.prototype.forEach.call(out.querySelectorAll("canvas"),function(c){cvm[docId(c.dataset.p,c.dataset.k)]=c;redrawCanvas(c);});
    Array.prototype.forEach.call(out.querySelectorAll("input.kb"),function(i){ivm[docId(i.dataset.p,i.dataset.k)]=i;});
    if(ro)Array.prototype.forEach.call(out.querySelectorAll(".cell"),function(el){ro.observe(el);});
  }
  function updateBtn(){$("showall").textContent=showAll?"Zurück zur Suche":"Alle Einträge anzeigen";}

  /* ---------- Ereignisse ---------- */
  q.addEventListener("input",function(){showAll=false;updateBtn();refresh();});
  q.addEventListener("keydown",function(e){if(e.key==="Enter"){var b=$("add");if(b)b.click();}});
  function newId(){return "p"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);}
  function deleteMarksOf(pid){
    var ks=keysOf(pid),m=marks[pid]||{},t=texts[pid]||{};delete marks[pid];delete texts[pid];delete tcol[pid];
    ks.forEach(function(k){delete dirty[docId(pid,k)];});
    if(mode==="local")return Promise.resolve();
    var chain=Promise.resolve();
    ks.forEach(function(k){if((m[k]&&m[k].length)||t[k])chain=chain.then(function(){return db.doc("marks/"+docId(pid,k)).delete();});});
    return chain;
  }
  out.addEventListener("click",function(e){
    var t=e.target;
    if(t.id==="add"&&!readOnly){
      var nm=q.value.trim();if(!nm)return;
      var id=newId(),obj={name:nm,order:Date.now()};
      state.people[id]=obj;
      if(mode==="local")saveLocal();
      else{busy++;setStatus(note+"Speichert …");db.doc("people/"+id).set(obj).then(function(){busy--;savedStatus();},function(er){busy--;delete state.people[id];refresh();setStatus("Name konnte nicht gespeichert werden ("+((er&&er.code)||"Fehler")+").",true);});}
      refresh();
    }else if(t.dataset&&t.dataset.del&&!readOnly){
      var did=t.dataset.del,p=state.people[did];if(!p)return;
      askConfirm("„"+p.name+"“ mit allen Einträgen löschen?",function(){
        delete state.people[did];
        if(mode==="local"){deleteMarksOf(did);saveLocal();}
        else{busy++;deleteMarksOf(did).then(function(){return db.doc("people/"+did).delete();}).then(function(){busy--;savedStatus();},function(er){busy--;setStatus("Löschen fehlgeschlagen ("+((er&&er.code)||"Fehler")+").",true);});}
        refresh();
      });
    }else if(t.id==="seed"&&!readOnly){seedAll();}
  });
  function seedAll(){
    if(mode==="local"){seedLocal();saveLocal();refresh();return;}
    setStatus("Lege Namen an …");busy++;
    var chain=Promise.resolve();
    NAMES.forEach(function(n,i){chain=chain.then(function(){return db.doc("people/p"+pad(i+1)).set({name:n,order:i+1});});});
    chain=chain.then(function(){return db.doc("meta/header").set(DEF);});
    chain.then(function(){busy--;savedStatus();},function(er){busy--;setStatus("Anlegen fehlgeschlagen ("+((er&&er.code)||"Fehler")+").",true);});
  }
  $("clear").addEventListener("click",function(){
    if(readOnly)return;
    askConfirm("Alle Eintragungen in allen Feldern für alle Personen löschen? Die Namen bleiben erhalten.",doClear);
  });
  function doClear(){
    var pids=Object.keys(marks).concat(Object.keys(texts)).filter(uniq).filter(hasEntries);
    if(mode==="local"){pids.forEach(function(p){delete marks[p];delete texts[p];delete tcol[p];});saveLocal();lastKey="";refresh();return;}
    setStatus("Lösche Eintragungen …");busy++;
    var chain=Promise.resolve();
    pids.forEach(function(p){var pr=deleteMarksOf(p);chain=chain.then(function(){return pr;});});
    lastKey="";refresh();
    chain.then(function(){busy--;savedStatus();},function(er){busy--;setStatus("Löschen fehlgeschlagen ("+((er&&er.code)||"Fehler")+").",true);});
  }
  $("showall").addEventListener("click",function(){
    if(showAll){showAll=false;updateBtn();refresh();savedStatus();return;}
    flushAll().then(function(){
      showAll=true;updateBtn();refresh();
      var n=ids().filter(hasEntries).length;
      setStatus(note+n+(n===1?" Name mit Einträgen":" Namen mit Einträgen")+".");
      window.scrollTo(0,0);
    });
  });

  /* ---------- Download als Bild ---------- */
  function exportPng(){
    var d=new Date(),stamp=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes());
    var fname="Wochentabelle_"+stamp+".png";
    function fail(er){
      if(er&&er.code==="declined")setStatus(note+"Download abgebrochen. Die Einträge sind trotzdem gespeichert.");
      else setStatus("Die Datei konnte nicht zum Download angeboten werden ("+((er&&er.code)||"Fehler")+"). Die Einträge sind trotzdem gespeichert.",true);
    }
    var persons=ids().filter(hasEntries);
    if(!persons.length){setStatus(note+"Noch keine Einträge, daher keine Datei erzeugt.");return;}
    if(!window.claude||!window.claude.use){fail({code:"unavailable"});return;}
    window.claude.use("downloads").then(function(dl){
      if(!dl){fail({code:"unavailable"});return;}
      var W=1100,nameW=120,nrW=34,cw=(W-nameW-nrW)/5,rh=64,gap=10,topH=150,thH=46;
      var H=topH+thH+persons.length*(6*rh+gap)+10,sc=Math.min(2,15000/H);
      var c=document.createElement("canvas");c.width=Math.round(W*sc);c.height=Math.round(H*sc);
      var x=c.getContext("2d");x.scale(sc,sc);
      x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
      x.fillStyle="#dce6f1";x.fillRect(0,0,W,topH-10);
      x.strokeStyle="#444444";x.lineWidth=1;x.strokeRect(.5,.5,W-1,topH-10);
      x.textAlign="center";x.textBaseline="middle";x.fillStyle="#111820";
      x.font="bold 26px Arial";x.fillText(state.header.t1,W/2,42);
      x.font="bold 20px Arial";x.fillText(state.header.t2,W/2,84);
      x.font="bold 17px Arial";x.fillText(state.header.t3,W/2,116);
      var y0=topH;
      x.fillStyle="#f2f2f2";x.fillRect(0,y0,W,thH);
      x.strokeRect(0,y0,nameW,thH);x.strokeRect(nameW,y0,nrW,thH);
      x.fillStyle="#111820";x.font="bold 14px Arial";x.fillText("Name",nameW/2,y0+thH/2);x.fillText("Nr.",nameW+nrW/2,y0+thH/2);
      for(var dd=0;dd<5;dd++){
        var hx=nameW+nrW+dd*cw;x.strokeRect(hx,y0,cw,thH);
        x.font="bold 14px Arial";x.fillText(DAYS[dd],hx+cw/2,y0+thH/2);
      }
      persons.forEach(function(pid,i){
        var py=topH+thH+i*(6*rh+gap),p=state.people[pid];
        x.fillStyle="#ffffff";x.fillRect(0,py,nameW,6*rh);x.strokeRect(0,py,nameW,6*rh);
        x.fillStyle="#111820";x.font="bold 15px Arial";x.textAlign="center";
        var parts=p.name.split(" "),first=parts.shift(),last=parts.join(" ");
        x.fillText(first,nameW/2,py+3*rh-10);if(last)x.fillText(last,nameW/2,py+3*rh+10);
        for(var r=0;r<6;r++){
          var ry=py+r*rh;
          x.fillStyle="#f2f2f2";x.fillRect(nameW,ry,nrW,rh);x.strokeRect(nameW,ry,nrW,rh);
          x.fillStyle="#556070";x.font="13px Arial";x.textAlign="center";x.fillText(String(r+1),nameW+nrW/2,ry+rh/2);
          for(var dc=0;dc<5;dc++){
            var cx=nameW+nrW+dc*cw;
            x.fillStyle=(r%2===1)?"#dae9f7":"#ffffff";x.fillRect(cx,ry,cw,rh);x.strokeRect(cx,ry,cw,rh);
            var ents=PLAN[r][dc];
            ents.forEach(function(en,ei){
              var ty=ents.length===1?ry+rh/2:ry+rh*(ei===0?.27:.73);
              x.textAlign="left";x.fillStyle="#111820";x.font="bold 15px Arial";x.fillText(en[0],cx+8,ty);
              x.textAlign="right";x.fillStyle="#3a6ea5";x.font="14px Arial";x.fillText(en[1],cx+cw-8,ty);
            });
            var tt=getT(pid,r+"-"+dc);
            if(tt){x.textAlign="center";x.fillStyle=inkPrint(getTC(pid,r+"-"+dc));x.font="bold 14px Arial";x.fillText(tt,cx+cw/2,ry+rh-11,cw-12);}
            var arr=getM(pid,r+"-"+dc);
            if(arr.length){
              var tc=document.createElement("canvas");tc.width=Math.round(cw*sc);tc.height=Math.round(rh*sc);
              var tx=tc.getContext("2d");tx.scale(sc,sc);drawStrokes(tx,arr,cw,rh,inkPrint);
              x.drawImage(tc,cx,ry,cw,rh);
            }
          }
        }
      });
      return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej({code:"bad_request"});},"image/png");}).then(function(blob){
        return dl.save({filename:fname,data:blob});
      }).then(function(){setStatus(note+"Datei „"+fname+"“ gespeichert. Alle Änderungen sind gesichert ("+clock()+" Uhr).");});
    }).catch(fail);
  }

  /* ---------- Start ---------- */
  function goLocal(){
    if(mode!=="pending")return;
    mode="local";note="Nicht angemeldet: Einträge nur auf diesem Gerät. ";
    loadLocal();applyRO();showHeader();lastKey="";refresh();setStatus(note+"Gespeichert in diesem Browser.");
  }
  function goDb(d,user){
    mode="db";db=d;
    Promise.resolve(user&&user.can?user.can("data.write"):null).catch(function(){return null}).then(function(v){
      readOnly=(v===false);applyRO();
      note=readOnly?"Nur Lesezugriff. ":"Gemeinsam bearbeiten: Änderungen sind live bei allen sichtbar. ";
      setStatus(note+"Lade …");
      db.doc("meta/header").onSnapshot(function(s){
        if(s.exists){var x=s.data()||{};["t1","t2","t3"].forEach(function(k){if(typeof x[k]==="string"&&!hdrTimer)state.header[k]=x[k];});}
        showHeader();
      },function(){});
      db.collection("people").onSnapshot(function(snap){
        var np={};
        snap.docs.forEach(function(doc){var x=doc.data()||{};np[doc.id]={name:String(x.name||""),order:Number(x.order)||0};});
        state.people=np;showHeader();refresh();
        if(idle())setStatus(note+"Alle Änderungen gespeichert.");
      },function(er){setStatus("Verbindung getrennt ("+((er&&er.code)||"Fehler")+"). Bitte Seite neu laden.",true);});
      db.collection("marks").onSnapshot(function(snap){
        var seen={},touched=false;
        snap.docs.forEach(function(doc){
          var x=doc.data()||{},pid=String(x.p||""),id=doc.id;
          if(!pid||id.indexOf(pid+"_")!==0)return;
          var k=id.slice(pid.length+1);seen[id]=1;
          if(dirty[id]||timers[id]||(cur&&cur.pid===pid&&cur.k===k))return;
          var arr=[];try{arr=JSON.parse(x.s||"[]");}catch(e){}
          setM(pid,k,Array.isArray(arr)?arr:[]);setT(pid,k,String(x.t||""));setTC(pid,k,Number(x.tc)||0);redrawKey(pid,k);syncInput(pid,k);touched=true;
        });
        Object.keys(marks).concat(Object.keys(texts)).filter(uniq).forEach(function(pid){
          keysOf(pid).forEach(function(k){
            var id=docId(pid,k);
            if(!seen[id]&&(getM(pid,k).length||getT(pid,k))&&!dirty[id]&&!timers[id]&&!(cur&&cur.pid===pid&&cur.k===k)){setM(pid,k,[]);setT(pid,k,"");redrawKey(pid,k);syncInput(pid,k);touched=true;}
          });
        });
        if(showAll&&touched)refresh();
        if(idle())setStatus(note+"Alle Änderungen gespeichert.");
      },function(er){setStatus("Verbindung getrennt ("+((er&&er.code)||"Fehler")+"). Bitte Seite neu laden.",true);});
    });
  }
  showHeader();refresh();updateBtn();applyRO();
  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){if(r[0])goDb(r[0],r[1]);else goLocal();},goLocal);
  }else goLocal();
})();
</script>
